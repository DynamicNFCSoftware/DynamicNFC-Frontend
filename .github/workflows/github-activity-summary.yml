name: GitHub Activity Summary

# Weekly commit summary. Shown on the run's "Summary" page and saved as a
# downloadable artifact. It never writes to the repo: main is protected
# (PR + passing checks required), so a direct push would fail.

on:
  schedule:
    - cron: "0 4 * * 1" # Monday 04:00 UTC (Sunday night, Toronto)
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "How many past hours to summarize"
        required: false
        default: "168"
      timezone:
        description: "Timezone for dates (IANA format)"
        required: false
        default: "America/Toronto"

permissions:
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build summary
        shell: bash
        env:
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '168' }}
          TZ: ${{ github.event.inputs.timezone || 'America/Toronto' }}
        run: |
          set -euo pipefail
          {
            echo "# GitHub Activity Summary - $(date '+%Y-%m-%d')"
            echo
            echo "_Timezone: ${TZ}; lookback: last ${LOOKBACK_HOURS} hour(s)._"
            echo
            git log --since="${LOOKBACK_HOURS} hours ago" \
              --invert-grep --grep='^chore(summary):' \
              --date=format-local:'%Y-%m-%d %H:%M' \
              --pretty=format:'- `%h` %s - %an (%ad)'
            echo
          } > activity-summary.md
          cat activity-summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: activity-summary
          path: activity-summary.md
          retention-days: 90
